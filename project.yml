name: EditMax
options:
  bundleIdPrefix: io.openhorizon
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  # App updates: checks the appcast every release carries (scripts/release.sh writes it), EdDSA-signed.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # Crash reports and feature counts (Support/Telemetry.swift), sent once the person has agreed.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.93.6
targets:
  EditMax:
    type: application
    platform: macOS
    sources:
      - path: EditMax
      # codemax, the bundled agent runtime (scripts/vendor-codemax.sh builds it from ../codemax-cli).
      - path: Vendor/codemax
        buildPhase:
          copyFiles:
            destination: resources
            subpath: bin
      # The API-key chat sidecar (Claude Agent SDK + Vercel AI SDK; scripts/vendor-agent.sh builds it from agent/).
      - path: Vendor/editmax-agent
        buildPhase:
          copyFiles:
            destination: resources
            subpath: bin
    preBuildScripts:
      - name: Vendor codemax
        shell: /bin/bash
        script: '"$SRCROOT/scripts/vendor-codemax.sh"'
        basedOnDependencyAnalysis: false
      - name: Vendor agent sidecar
        shell: /bin/bash
        script: '"$SRCROOT/scripts/vendor-agent.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - package: MCP
        product: MCP
      - package: Sparkle
        product: Sparkle
      - package: PostHog
        product: PostHog
    info:
      path: EditMax/Resources/Info.plist
      properties:
        CFBundleDisplayName: EditMax
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.2.1"
        NSHumanReadableCopyright: "© 2026 Saidev Dhal"
        # Asked once by the macOS 15 caption path (SFSpeechRecognizer); without it that request ends the app.
        NSSpeechRecognitionUsageDescription: "EditMax turns the speech in your footage into captions, and what you say to the agent into text, on this Mac."
        # The chat's microphone (Dictation.swift). Without it the first microphone request ends the app.
        NSMicrophoneUsageDescription: "EditMax listens when you press the microphone in the chat, so you can speak to the agent instead of typing."
        CFBundleVersion: "157"
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        # Updates (AppUpdater): the appcast every release carries, its EdDSA key, daily background checks that download
        # and install on quit. The private key is in the login keychain (account "editmax"), backed up outside the repo.
        SUFeedURL: https://github.com/SkidGod4444/editmax/releases/latest/download/appcast.xml
        SUPublicEDKey: ngzQ+Q2XfZRlpCVj1AzTZ5LtO8eX2bHC4BQTF/Aj7ZQ=
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: EditMax Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [io.openhorizon.editmax.project]
            CFBundleTypeIconFile: ProjectDoc
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.openhorizon.editmax.project
            UTTypeDescription: EditMax Project
            UTTypeConformsTo: [public.json, public.data]
            UTTypeIconFile: ProjectDoc
            UTTypeTagSpecification:
              public.filename-extension: [emx, editmax]
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # A stable signing identity: with ad-hoc ("-") signing every build is a new app to macOS, so Screen Recording
        # and keychain grants are forgotten on each rebuild. Falls back to ad-hoc when the certificate is not installed.
        # Referenced by SHA-1 hash: by name Xcode insists on a matching team and this certificate's team ID is not
        # the one in its common name. Run `security find-identity -v -p codesigning` to see the installed identities.
        CODE_SIGN_IDENTITY: DEB9BB318F916293DEB2D9B0378F54C8D5154E81
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.openhorizon.editmax
        SWIFT_EMIT_LOC_STRINGS: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  # Unit + engine tests, hosted in the app (the app skips its launch UI under XCTest; see AppDelegate.isTesting).
  EditMaxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: EditMaxTests
    dependencies:
      - target: EditMax
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: io.openhorizon.editmax.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/EditMax.app/Contents/MacOS/EditMax"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
schemes:
  EditMax:
    build:
      targets:
        EditMax: all
        EditMaxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EditMaxTests
